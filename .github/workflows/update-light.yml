name: Update light

on:
  schedule:
    - cron: "*/10 * * * *"    # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-send the colour even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set bulb
        run: python bulb.py ${{ inputs.force && '--force' || '' }}
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          GOVEE_DEVICE: ${{ secrets.GOVEE_DEVICE }}
          GOVEE_SKU: ${{ secrets.GOVEE_SKU }}
          IDLE_MODE: ${{ vars.IDLE_MODE }}
      - name: Save bulb state
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add docs/light_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Light: $(python -c "import json;print(json.load(open('docs/light_state.json'))['mode'])")"
            git pull --rebase
            git push
          fi
